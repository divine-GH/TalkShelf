<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}note-brain{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">note-brain</a>
    <nav>
      <a href="/" {% if active == 'index' %}class="on"{% endif %}>记录</a>
      <a href="/notes" {% if active == 'notes' %}class="on"{% endif %}>笔记</a>
      <a href="/ask" {% if active == 'ask' %}class="on"{% endif %}>问答</a>
      <a href="/review" {% if active == 'review' %}class="on"{% endif %}>回顾</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block script %}{% endblock %}
</body>
</html>
