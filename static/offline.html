<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fed">
  <title>TalkShelf — 离线</title>
  <style>
    /* 离线兜底页：无外部依赖（服务器不可达时唯一的可用页面），内联样式，
       配色沿用 style.css 的 design tokens（--bg/--primary/--card/--text） */
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2329;
      --muted: #8a919f;
      --primary: #2f6fed;
      --border: #e4e7ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
      text-align: center;
    }
    .card .logo { font-size: 2rem; }
    .card h1 { font-size: 1.2rem; margin: 10px 0 6px; }
    .card p { margin: 6px 0 0; color: var(--muted); font-size: 0.95rem; }
    .card button {
      margin-top: 18px;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📚</div>
    <h1>无法连接 TalkShelf</h1>
    <p>服务器（家里的电脑）可能未开机或网络不通。<br>笔记数据仍安全保存在服务器上，恢复连接后即可使用。</p>
    <button type="button" onclick="location.reload()">重试</button>
  </div>
</body>
</html>
